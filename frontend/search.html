<!DOCTYPE html>

<html class="w-full h-full overflow-hidden" lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>校园失物招领 · 搜索结果</title>
<script src="https://modao.cc/agent-py/static/source/js/tailwindcss.js"></script>
<script src="https://modao.cc/agent-py/static/source/js/iconify-icon.min.js"></script>
<link rel="stylesheet" href="css/visual-theme.css"/>
</head>
<body class="w-full h-full m-0 overflow-hidden flex items-center justify-center bg-slate-100 text-slate-800 antialiased">
<div id="phone-canvas" class="w-full h-full max-w-[393px] max-h-[852px] bg-[#f5f7fb] flex flex-col overflow-hidden relative">
<!-- 搜索结果页：关键词 + 类型筛选结果。当前由内嵌卡片 + localStorage 驱动（阶段 3 改为 GET /api/items/search），交互见 js/search.js -->
<!-- 顶部：可编辑搜索框 + 筛选 -->
<header class="shrink-0 bg-white border-b border-slate-100 px-3 pt-4 pb-3">
<div class="flex items-center gap-1">
<a class="w-9 h-9 shrink-0 rounded-full flex items-center justify-center text-slate-500 active:bg-slate-100" href="index.html">
<iconify-icon class="text-[24px]" icon="mdi:chevron-left"></iconify-icon>
</a>
<form class="flex-1 min-w-0" onsubmit="return onSubmitSearch(event)">
<div class="flex items-center gap-2 h-10 px-3 rounded-xl bg-slate-100">
<iconify-icon class="text-[18px] text-slate-400" icon="mdi:magnify"></iconify-icon>
<input class="flex-1 min-w-0 bg-transparent text-[14px] text-slate-700 placeholder:text-slate-300 focus:outline-none" enterkeyhint="search" id="kw" placeholder="搜索物品名称或关键词" type="text" value="校园卡"/>
<button class="shrink-0 h-7 px-2.5 rounded-lg bg-blue-600 text-white text-[12px] font-medium active:bg-blue-700" type="submit">搜索</button>
</div>
</form>
</div>
<div class="mt-3 flex items-center gap-2 pl-1">
<button class="px-4 h-8 rounded-full border text-[12px] font-medium bg-blue-600 text-white border-blue-600 transition" data-tab="all" onclick="setFilter('all')">全部</button>
<button class="px-4 h-8 rounded-full border text-[12px] font-medium bg-white text-slate-500 border-slate-200 transition" data-tab="seek" onclick="setFilter('seek')">寻物</button>
<button class="px-4 h-8 rounded-full border text-[12px] font-medium bg-white text-slate-500 border-slate-200 transition" data-tab="find" onclick="setFilter('find')">招领</button>
</div>
</header>
<!-- 结果滚动区：数据来自 GET /api/items/search，关键词匹配与类型筛选都由服务端做、
     结果顺序也由服务端排好；本页只负责渲染，不再遍历 DOM 做匹配 -->
<div class="flex-1 min-h-0 overflow-y-auto overflow-x-hidden [scrollbar-width:none] [&amp;::-webkit-scrollbar]:hidden">
<div class="px-4 pt-4 pb-5">
<p class="text-[12px] text-slate-400">
          关键词「<span class="text-blue-600 font-medium" id="kwEcho">校园卡</span>」共
          <span class="text-blue-600 font-semibold" id="resultCount">0</span> 条结果
        </p>
<div class="mt-3" id="resultList">
<!-- 卡片由 js/search.js 渲染进下面这一层。它们必须带 data-result 与 data-keywords ——
     主题 CSS 用 `#resultList [data-result]` 选中卡片，漏掉属性会静默丢掉左侧金线与圆角 -->
<div class="flex flex-col gap-3" id="resultItems">
</div>
</div>
<!-- 无结果 -->
<div class="hidden" id="emptyState">
<div class="flex flex-col items-center justify-center px-6 py-16 text-center">
<div class="w-16 h-16 rounded-full bg-white border border-slate-100 flex items-center justify-center">
<iconify-icon class="text-[30px] text-slate-300" icon="mdi:file-search-outline"></iconify-icon>
</div>
<p class="mt-4 text-[14px] font-medium text-slate-600">没有找到相关信息，试试其他关键词</p>
<p class="mt-1.5 text-[12px] text-slate-400">换个说法，或点击下方常见关键词重新搜索</p>
<div class="mt-4 flex flex-wrap justify-center gap-2">
<button class="px-3 h-8 rounded-full border border-slate-200 bg-white text-[12px] text-slate-600 active:bg-slate-50" onclick="quickSearch('校园卡')">校园卡</button>
<button class="px-3 h-8 rounded-full border border-slate-200 bg-white text-[12px] text-slate-600 active:bg-slate-50" onclick="quickSearch('钥匙')">钥匙</button>
<button class="px-3 h-8 rounded-full border border-slate-200 bg-white text-[12px] text-slate-600 active:bg-slate-50" onclick="quickSearch('水杯')">水杯</button>
<button class="px-3 h-8 rounded-full border border-slate-200 bg-white text-[12px] text-slate-600 active:bg-slate-50" onclick="quickSearch('雨伞')">雨伞</button>
<button class="px-3 h-8 rounded-full border border-slate-200 bg-white text-[12px] text-slate-600 active:bg-slate-50" onclick="quickSearch('耳机')">耳机</button>
</div>
</div>
</div>
<p class="mt-4 text-center text-[11px] text-slate-400">结果按发布时间从新到旧排列</p>
</div>
</div>
<!-- 动态样式占位：Tailwind 运行时按源码生成样式类，脚本动态用到的类必须在这里出现。
     卡片改由 renderCard 渲染后，这些类是靠这一行兜住的（尤其已解决卡片的 opacity-80）。
     与 index.html 的占位保持一致——两页渲染的是同一个卡片模板。 -->
<div class="hidden rounded-2xl bg-white p-4 border border-slate-100 shadow-sm transition active:scale-[0.99] opacity-80 flex items-start gap-3 w-11 h-11 shrink-0 rounded-xl bg-blue-50 bg-emerald-50 flex items-center justify-center text-[22px] text-blue-600 text-emerald-600 min-w-0 flex-1 flex items-center gap-1.5 text-[15px] font-semibold text-slate-800 truncate px-1.5 py-0.5 rounded text-[10px] font-medium ml-auto bg-orange-50 text-orange-600 bg-amber-50 text-amber-600 mt-1.5 flex items-center gap-3 text-[11px] text-slate-400 gap-0.5 text-[13px] leading-relaxed text-slate-500 line-clamp-2"></div>
</div>
<script src="js/api.js"></script>
<script src="js/common.js"></script>
<script src="js/search.js"></script>
</body>
</html>
